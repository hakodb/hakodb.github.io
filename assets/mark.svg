<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HakoDB mark">
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <!-- body: two slate facets -->
  <polygon points="8,22 32,36 32,58 8,44" fill="#334155"/>
  <polygon points="56,22 32,36 32,58 56,44" fill="#1E293B" stroke="#0F172A" stroke-width="1"/>
  <!-- lid: the data-green top face -->
  <polygon points="32,8 56,22 32,36 8,22" fill="url(#lid)"/>
  <!-- lid seam -->
  <line x1="8" y1="22" x2="32" y2="36" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="56" y1="22" x2="32" y2="36" stroke="#0F172A" stroke-width="1.5"/>
</svg>
